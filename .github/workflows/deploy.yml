name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run check && npm run build
      - run: |
          mkdir -p ~/.ssh && install -m 600 /dev/null ~/.ssh/id
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id
          ssh-keyscan -H 80.64.31.169 >> ~/.ssh/known_hosts
          rsync -rlt --delete -e "ssh -i ~/.ssh/id" out/ deploy@80.64.31.169:
